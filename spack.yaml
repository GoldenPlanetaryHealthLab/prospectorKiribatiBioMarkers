# This is a Spack Environment file.
#
# It describes a set of packages to be installed, along with
# configuration settings.
spack:
  # add package specs to the `specs` list
  specs:
  - r@4.5.1
  - libxml2
  - icu4c
  - libx11
  - git
  - curl
  - openssl
  - libgit2
  - cmake
  - gmake
  - freetype
  - libjpeg-turbo
  - libpng
  - libtiff
  - libwebp
  - fontconfig
  - fribidi
  - harfbuzz
  - libuv
  view: true
  concretizer:
    unify: true
