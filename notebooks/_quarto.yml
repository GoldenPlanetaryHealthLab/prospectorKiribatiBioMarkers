project:
  type: book
  output-dir: ../docs
  render:
    - "*.qmd"

# The Manual displays source code and emits selected artifacts, but it never
# initializes a computational engine. The container runner owns R execution.
engine: markdown

profile:
  default: authoring

book:
  title: "Kiribati Biomarkers Curation Manual"
  chapters:
    - index.qmd
    - part: "Project Setup"
      chapters:
        - 00_cover.qmd
        - 01_misc-render-isolated.qmd
        - 02_misc-project-contract.qmd
        - 03_misc-data-governance.qmd
    - part: "Infrastructure"
      chapters:
        - infrastructure/10_page-direnv.qmd
        - infrastructure/11_page-spack.qmd
        - infrastructure/12_page-jinja.qmd
        - infrastructure/13_page-jinja-build.qmd
        - infrastructure/14_page-uvr.qmd
        - infrastructure/15_page-runner.qmd
    - part: "Pipeline"
      chapters:
        - pipeline/16_page-stage-inputs.qmd
        - pipeline/17_page-inspect-source-data.qmd
        - pipeline/18_page-targets-curation.qmd
        - pipeline/19_page-package-release.qmd
        - pipeline/20_page-execute-pipeline.qmd
        - pipeline/21_page-verify-release.qmd

execute:
  enabled: false

format:
  GoldenPlanetaryHealthLab/quarto-manual-html: default
